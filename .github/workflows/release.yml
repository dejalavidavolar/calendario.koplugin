name: Release

# Al crear una etiqueta (tag) que empiece con "v" (p. ej. v1.0.1) se arma el zip del plugin
# y se publica un release con él adjunto.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que el plugin exista
        run: test -f calendario.koplugin/main.lua

      - name: Armar el zip
        run: zip -qr "calendario.koplugin-${GITHUB_REF_NAME}.zip" calendario.koplugin

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "calendario.koplugin-${GITHUB_REF_NAME}.zip" \
            --title "Calendario ${GITHUB_REF_NAME}" \
            --generate-notes
